name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Environment Information
        run: |
          echo "CI Pipeline Started"
          echo "Running on:"
          uname -a

      - name: Verify Project Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML File
        run: |
          test -f index.html
          echo "index.html found successfully"

      - name: Validate CSS File
        run: |
          test -f style.css
          echo "style.css found successfully"

      - name: Validate JavaScript File
        run: |
          test -f script.js
          echo "script.js found successfully"

      - name: CI Build Completed
        run: |
          echo "Build and validation completed successfully"
