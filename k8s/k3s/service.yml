apiVersion: v1
kind: Service
metadata:
  name: devops-service
  labels:
    app: devops-app
spec:
  # ClusterIP, not NodePort: access is via `kubectl port-forward` tunneled
  # over the same k3s API connection (port 6443, already open to the admin
  # IP), so no extra NodePort range needs opening on the EC2 security group.
  type: ClusterIP
  selector:
    app: devops-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
